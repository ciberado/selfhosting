services:
  mqtt: 
    image: eclipse-mosquitto
    network_mode: service:mqtt-ts
    depends_on:
      - mqtt-ts
    volumes:
      - ./config:/mosquitto/config:rw
      - ./data:/mosquitto/data:rw
      - ./log:/mosquitto/log:rw
    restart: no
  mqtt-ts:
    image: tailscale/tailscale:latest
    hostname: mqtt
    environment:
      - TS_AUTHKEY=$CLIENT_SECRET
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
    ports:
      - 1883:1883
      - 9001:9001
    volumes:
      - tailscale-data-mqtt:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: no
volumes:
  config:
  data:
  log:
  tailscale-data-mqtt:
    driver: local
