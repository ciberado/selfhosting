services:
  bichon-server:
    container_name: bichon_server
    image: rustmailer/bichon:latest 
    network_mode: service:bichon-ts
    depends_on:
      - bichon-ts
    restart: no
    volumes:
      - ./bichon-data:/data
    environment:
      - BICHON_LOG_LEVEL=info
      - BICHON_ROOT_DIR=/data
      - BICHON_CORS_ORIGINS=https://bichon.<TU-TAILNET>.ts.net
  bichon-ts:
    hostname: bichon
    container_name: bichon_ts
    image: tailscale/tailscale:latest
    environment:
      - TS_AUTHKEY=$CLIENT_SECRET
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts.json
    volumes:
      - tailscale-data-bichon:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./config:/config
    cap_add:
      - net_admin
      - sys_module
    restart: no

volumes:
  model-cache:
  tailscale-data-bichon:
    driver: local

