name: geekslides

services:
  geekslides-slides:
    container_name: geekslides_slides
    image: ciberado/geekslides-slides:latest
    network_mode: service:geekslides-ts
    depends_on:
      - geekslides-ts
    restart: no

  geekslides-broker:
    container_name: geekslides_broker
    image: ciberado/geekslides-broker:latest
    network_mode: service:geekslides-ts
    depends_on:
      - geekslides-ts
    restart: no
    
  geekslides-ts:
    hostname: geekslides
    container_name: geekslides_ts
    image: tailscale/tailscale:latest
    environment:
      - TS_AUTHKEY=$CLIENT_SECRET
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/geekslides.json
    volumes:
      - tailscale-data-geekslides:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./ts:/config
    cap_add:
      - net_admin
      - sys_module
    restart: no

volumes:
  model-cache:
  tailscale-data-geekslides:
    driver: local

