services:
  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:latest
    network_mode: service:n8n-ts
    depends_on:
      - n8n-ts
    restart: unless-stopped
    volumes:
      - ./n8n-data:/home/node/.n8n
    environment:
      - N8N_HOST=n8n.<TU-TAILNET>.ts.net
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - N8N_EDITOR_BASE_URL=https://n8n.<TU-TAILNET>.ts.net/
      - WEBHOOK_URL=https://n8n.<TU-DOMINIO>/
      - N8N_PROXY_HOPS=2
      - N8N_SECURE_COOKIE=true
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid

  n8n-ts:
    hostname: n8n
    container_name: n8n_ts
    image: tailscale/tailscale:latest
    environment:
      - TS_AUTHKEY=$CLIENT_SECRET
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts.json
    volumes:
      - tailscale-data-n8n:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./config:/config
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

volumes:
  tailscale-data-n8n:
    driver: local
