services:
  ethercalc:
    image: node:14-alpine
    command: sh -c "npm install -g ethercalc && ethercalc"
    environment:
      REDIS_HOST : redis
      REDIS_PORT : 6379
    network_mode: service:ethercalc-ts
    restart: no

  redis:
    image: redis:latest
    hostname: redis
    command: redis-server --appendonly yes
    restart: no

  ethercalc-ts:
    hostname: calc
    container_name: ethercalc_ts
    image: tailscale/tailscale:latest
    environment:
      - TS_AUTHKEY=$CLIENT_SECRET
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ethercalc.json
    volumes:
      - tailscale-data-ethercalc:/var/lib/tailscale
      - ./ethercalc-ts/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: no


volumes:
  tailscale-data-ethercalc:
    driver: local
