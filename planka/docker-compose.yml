services:
  planka:
    image: ghcr.io/plankanban/planka:2.0.0-rc.2
    network_mode: service:planka-ts
    restart: no
    volumes:
      - favicons:/app/public/favicons
      - user-avatars:/app/public/user-avatars
      - background-images:/app/public/background-images
      - attachments:/app/private/attachments
    environment:
      - BASE_URL=https://planka.<TU-TAILNET>.ts.net
      - DATABASE_URL=postgresql://postgres@postgres/planka
      - SECRET_KEY=<ESCRIBE AQUÍ CLAVE ALEATORIA (openssl rand -hex 32)>
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: no
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=planka
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - planka-ts

  planka-ts:
    hostname: planka
    container_name: planka_ts
    image: tailscale/tailscale:latest
    environment:
      - TS_AUTHKEY=$CLIENT_SECRET
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts.json
    volumes:
      - tailscale-data-planka:/var/lib/tailscale
      - ./ts/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: no



volumes:
  favicons:
  user-avatars:
  background-images:
  attachments:
  db-data:
  tailscale-data-planka:
    driver: local
