name: dirtyrss

services:
  dirtyrss-server:
    container_name: dirtyrss_server
    image: ciberado/dirtyrss
    network_mode: service:dirtyrss-ts
    depends_on:
      - dirtyrss-ts
    restart: no
    
  dirtyrss-ts:
    hostname: dirtyrss
    container_name: dirtyrss_ts
    image: tailscale/tailscale:latest
    environment:
      - TS_AUTHKEY=$CLIENT_SECRET
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/dirtyrss.json
    volumes:
      - tailscale-data-dirtyrss:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./ts:/config
    cap_add:
      - net_admin
      - sys_module
    restart: no

volumes:
  model-cache:
  tailscale-data-dirtyrss:
    driver: local

